name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Present so config/env.ts parses and `prisma generate` resolves the
      # datasource. Never connected to — the gate steps are DB-free.
      DATABASE_URL: postgresql://user:pass@localhost:5432/homes
      API_BASE_URL: http://localhost:4000/api/v1
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_chars_long_xx
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_chars_long_x
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @homes/backend exec prisma generate

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Backend tests
        run: pnpm --filter @homes/backend test

      - name: Build (all packages)
        run: pnpm -r build

      # Advisory until the pre-existing Biome backlog is cleared — does not gate.
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true
